<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金額查詢系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
            box-sizing: border-box;
        }
        /* Logo 樣式 */
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 160px; /* 可根據你的 logo 大小調整 */
            height: auto;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            background-color: #fff;
            box-sizing: border-box;
        }
        .result {
            font-size: 18px;
            color: #555;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 5px;
        }
        /* 底部聯絡資訊樣式 */
        .contact-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
            text-align: left;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .contact-info div {
            margin-bottom: 5px;
            word-break: break-all;
        }
        .contact-info a {
            color: #3498db;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo 區塊：直接讀取你指定 GitHub 倉庫中的 logo.png -->
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/tjcpm109/tjcpm/cead8fe9d60a29ef4e203247ecc3f692dd5433eb/logo.png" alt="公司 Logo" id="companyLogo">
        </div>

        <h2>金額查詢系統</h2>
        
        <!-- 第一層主選單 -->
        <div class="form-group">
            <label for="mainCategory">選擇主類別：</label>
            <select id="mainCategory" onchange="handleMainChange()">
                <option value="" disabled selected>請選擇項目</option>
                <option value="training">人才培訓 (NT$ 500)</option>
                <option value="regen">再生醫療 (NT$ 3,200)</option>
                <option value="ldts">第三類 LDTs</option>
            </select>
        </div>

        <!-- 第二層子選單 (預設隱藏，選 LDTs 時才出現) -->
        <div class="form-group" id="subCategoryGroup" style="display: none;">
            <label for="subCategory">選擇 LDTs 細項：</label>
            <select id="subCategory" onchange="updatePrice()">
                <option value="" disabled selected>請選擇細項</option>
                <option value="6000">單類別 A+B (NT$ 6,000)</option>
                <option value="9500">A+B+D (NT$ 9,500)</option>
            </select>
        </div>

        <!-- 顯示結果 -->
        <div class="result">
            對應金額：
            <div class="price" id="priceDisplay">NT$ 0</div>
        </div>

        <!-- 底部聯絡資訊 (可自行替換真實資料) -->
        <div class="contact-info">
            <div>📞 <strong>聯絡電話：</strong><a href="tel:0212345678">02-1234-5678</a></div>
            <div>✉️ <strong>電子信箱：</strong><a href="mailto:service@example.com">service@example.com</a></div>
            <div>🌐 <strong>官方網站：</strong><a href="https://www.example.com" target="_blank">www.example.com</a></div>
            <div>📝 <strong>報名網址：</strong><a href="https://www.example.com/register" target="_blank">點此前往報名</a></div>
        </div>
    </div>

    <script>
        function handleMainChange() {
            const mainCategory = document.getElementById("mainCategory").value;
            const subCategoryGroup = document.getElementById("subCategoryGroup");
            const subCategory = document.getElementById("subCategory");
            const priceDisplay = document.getElementById("priceDisplay");

            // 重置子選單與金額
            subCategory.value = "";
            priceDisplay.textContent = "NT$ 0";

            if (mainCategory === "ldts") {
                subCategoryGroup.style.display = "block";
            } else {
                subCategoryGroup.style.display = "none";
                
                if (mainCategory === "training") {
                    priceDisplay.textContent = "NT$ 500";
                } else if (mainCategory === "regen") {
                    priceDisplay.textContent = `NT$ ${Number(3200).toLocaleString()}`;
                }
            }
        }

        function updatePrice() {
            const subCategoryValue = document.getElementById("subCategory").value;
            const priceDisplay = document.getElementById("priceDisplay");

            if (subCategoryValue) {
                priceDisplay.textContent = `NT$ ${Number(subCategoryValue).toLocaleString()}`;
            } else {
                priceDisplay.textContent = "NT$ 0";
            }
        }
    </script>

</body>
</html>

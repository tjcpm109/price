<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金額查詢系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 420px;
            box-sizing: border-box;
        }
        /* Logo 樣式 */
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 160px;
            height: auto;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            background-color: #fff;
            box-sizing: border-box;
        }
        .result {
            font-size: 16px;
            color: #555;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        .result-item {
            margin-bottom: 8px;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 5px;
            text-align: right;
        }
        /* 底部聯絡資訊樣式 */
        .contact-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
            text-align: left;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .contact-info div {
            margin-bottom: 5px;
            word-break: break-all;
        }
        .contact-info a {
            color: #3498db;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo 區塊 -->
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/tjcpm109/tjcpm/cead8fe9d60a29ef4e203247ecc3f692dd5433eb/logo.png" alt="公司 Logo" id="companyLogo">
        </div>

        <h2>金額查詢系統</h2>
        
        <!-- 第一層主選單 -->
        <div class="form-group">
            <label for="mainCategory">選擇主類別：</label>
            <select id="mainCategory" onchange="handleMainChange()">
                <option value="" disabled selected>請選擇項目</option>
                <option value="training">人才培訓</option>
                <option value="regen">再生醫療</option>
                <option value="ldts">第三類 LDTs 審查報名</option>
            </select>
        </div>

        <!-- 第二層 LDTs 身分別 (選 LDTs 時出現) -->
        <div class="form-group" id="ldtsSubGroup" style="display: none;">
            <label for="ldtsType">選擇身分別 / 組合類別：</label>
            <select id="ldtsType" onchange="handleLdtsTypeChange()">
                <option value="" disabled selected>請選擇身分與組合</option>
                <optgroup label="新進 (4,500元 + 加類別金額)">
                    <option value="new_AB">新進：A+B (加類別 500元 / 報名費 5,000元)</option>
                    <option value="new_AD">新進：A+D (加類別 1,000元 / 報名費 5,500元)</option>
                    <option value="new_BD">新進：B+D (加類別 500元 / 報名費 5,000元)</option>
                    <option value="new_ABD">新進：A+B+D (加類別 1,500元 / 報名費 6,000元)</option>
                </optgroup>
                <optgroup label="資深 (3,000元 + 加類別金額)">
                    <option value="senior_EF">資深：E+F (加類別 1,500元 / 報名費 4,500元)</option>
                    <option value="senior_EH">資深：E+H (加類別 1,500元 / 報名費 4,500元)</option>
                    <option value="senior_FH">資深：F+H (加類別 1,000元 / 報名費 4,000元)</option>
                    <option value="senior_EFH">資深：E+F+H (加類別 3,000元 / 報名費 6,000元)</option>
                </optgroup>
                <optgroup label="跨資格報名 (資深+新進實驗室人員，3,000元 + 加類別金額)">
                    <option value="cross_EB">跨資格：E+B (加類別 2,000元 / 報名費 5,000元)</option>
                    <option value="cross_ED">跨資格：E+D (加類別 3,000元 / 報名費 6,000元)</option>
                    <option value="cross_EBD">跨資格：E+B+D (加類別 3,000元 / 報名費 6,000元)</option>
                    <option value="cross_FA">跨資格：F+A (加類別 2,500元 / 報名費 5,500元)</option>
                    <option value="cross_FD">跨資格：F+D (加類別 2,500元 / 報名費 5,500元)</option>
                    <option value="cross_FAD">跨資格：F+A+D (加類別 3,000元 / 報名費 6,000元)</option>
                    <option value="cross_HA">跨資格：H+A (加類別 3,000元 / 報名費 6,000元)</option>
                    <option value="cross_HB">跨資格：H+B (加類別 2,500元 / 報名費 5,500元)</option>
                    <option value="cross_HAB">跨資格：H+A+B (加類別 3,000元 / 報名費 6,000元)</option>
                </optgroup>
            </select>
        </div>

        <!-- 顯示結果 -->
        <div class="result" id="resultBox">
            <div class="result-item" id="extraFeeText" style="display: none;">加類別金額：<span id="extraDisplay">NT$ 0</span></div>
            <div>最終應繳報名費：</div>
            <div class="price" id="priceDisplay">NT$ 0</div>
        </div>

        <!-- 底部聯絡資訊 -->
        <div class="contact-info">
            <div>📞 <strong>聯絡電話：</strong><a href="tel:0212345678">02-1234-5678</a></div>
            <div>✉️ <strong>電子信箱：</strong><a href="mailto:service@example.com">service@example.com</a></div>
            <div>🌐 <strong>官方網站：</strong><a href="https://www.example.com" target="_blank">www.example.com</a></div>
            <div>📝 <strong>報名網址：</strong><a href="https://www.example.com/register" target="_blank">點此前往報名</a></div>
        </div>
    </div>

    <script>
        // 定義 LDTs 各選項的加類別金額與總報名費
        const ldtsPrices = {
            // 新進
            "new_AB": { extra: 500, total: 5000 },
            "new_AD": { extra: 1000, total: 5500 },
            "new_BD": { extra: 500, total: 5000 },
            "new_ABD": { extra: 1500, total: 6000 },
            // 資深
            "senior_EF": { extra: 1500, total: 4500 },
            "senior_EH": { extra: 1500, total: 4500 },
            "senior_FH": { extra: 1000, total: 4000 },
            "senior_EFH": { extra: 3000, total: 6000 },
            // 跨資格
            "cross_EB": { extra: 2000, total: 5000 },
            "cross_ED": { extra: 3000, total: 6000 },
            "cross_EBD": { extra: 3000, total: 6000 },
            "cross_FA": { extra: 2500, total: 5500 },
            "cross_FD": { extra: 2500, total: 5500 },
            "cross_FAD": { extra: 3000, total: 6000 },
            "cross_HA": { extra: 3000, total: 6000 },
            "cross_HB": { extra: 2500, total: 5500 },
            "cross_HAB": { extra: 3000, total: 6000 }
        };

        function handleMainChange() {
            const mainCategory = document.getElementById("mainCategory").value;
            const ldtsSubGroup = document.getElementById("ldtsSubGroup");
            const ldtsType = document.getElementById("ldtsType");
            const priceDisplay = document.getElementById("priceDisplay");
            const extraFeeText = document.getElementById("extraFeeText");
            const extraDisplay = document.getElementById("extraDisplay");

            // 重置
            ldtsType.value = "";
            extraFeeText.style.display = "none";

            if (mainCategory === "ldts") {
                ldtsSubGroup.style.display = "block";
                priceDisplay.textContent = "NT$ 0";
            } else {
                ldtsSubGroup.style.display = "none";
                if (mainCategory === "training") {
                    priceDisplay.textContent = "NT$ 500";
                } else if (mainCategory === "regen") {
                    priceDisplay.textContent = "NT$ 3,200";
                }
            }
        }

        function handleLdtsTypeChange() {
            const selectedKey = document.getElementById("ldtsType").value;
            const priceDisplay = document.getElementById("priceDisplay");
            const extraFeeText = document.getElementById("extraFeeText");
            const extraDisplay = document.getElementById("extraDisplay");

            if (selectedKey && ldtsPrices[selectedKey]) {
                const data = ldtsPrices[selectedKey];
                extraDisplay.textContent = `NT$ ${data.extra.toLocaleString()}`;
                extraFeeText.style.display = "block";
                priceDisplay.textContent = `NT$ ${data.total.toLocaleString()}`;
            } else {
                extraFeeText.style.display = "none";
                priceDisplay.textContent = "NT$ 0";
            }
        }
    </script>

</body>
</html>
